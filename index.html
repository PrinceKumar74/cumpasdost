<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- SEO -->
  <title>CumpasDost | Web Design, Development & Digital Marketing</title>
  <meta name="description"
    content="CumpasDost builds high-converting websites and mobile apps. Web design, development, SEO & digital marketing services. Get your quote today." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://www.cumpasdost.com" />
  <link rel="icon" type="image/png" href="/icon.png" />

  <!-- ================= GOOGLE ANALYTICS (GA4) ================= -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VP7Y71CLWW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-VP7Y71CLWW', {
      page_path: window.location.pathname,
    });

    /* ================= GLOBAL TRACKING FUNCTIONS ================= */

    // ✅ Service View (Pricing Page)
    window.trackServiceView = function (service) {
      gtag("event", "view_item", {
        currency: "INR",
        value: service.price,
        items: [{
          item_id: service.id,
          item_name: service.name,
          price: service.price,
          quantity: 1,
          item_category: "services"
        }]
      });
    };

    // ✅ Service Click
    window.trackServiceClick = function (service) {
      gtag("event", "select_item", {
        currency: "INR",
        value: service.price,
        items: [{
          item_id: service.id,
          item_name: service.name,
          price: service.price,
          quantity: 1
        }]
      });
    };

    // ✅ Form Lead (Email)
    window.trackFormSuccess = function () {
      gtag("event", "generate_lead", {
        method: "email_form"
      });
    };

    // ✅ WhatsApp Lead
    window.trackWhatsApp = function () {
      gtag("event", "generate_lead", {
        method: "whatsapp"
      });
    };

  </script>

  <!-- ================= SCHEMA ================= -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "CumpasDost",
    "url": "https://www.cumpasdost.com",
    "logo": "https://www.cumpasdost.com/icon.png"
  }
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
