    /* GA4 EVENTS */
    function trackCTA() {
      gtag("event", "cta_click", {
        event_category: "engagement",
      });
    }

    function trackForm() {
      gtag("event", "form_submit", {
        event_category: "lead",
      });
    }

    /* Scroll 50% */
    let scrollTracked = false;
    window.addEventListener("scroll", () => {
      if (!scrollTracked &&
        window.scrollY > document.body.scrollHeight * 0.5
      ) {
        gtag("event", "scroll_50", {
          event_category: "engagement",
        });
        scrollTracked = true;
      }
    });
  </script>
